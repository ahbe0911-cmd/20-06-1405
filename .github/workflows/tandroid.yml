name: Fork Client

on:
  push:
    branches:
      - '**'

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v3.1.0
        with:
          submodules: true
      - name: Apply Persian font engine patch
        if: github.ref == 'refs/heads/feature/persian-font-selector'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java')
          text = path.read_text(encoding='utf-8')
          old = '''    public static Typeface getTypeface(String assetPath) {
        synchronized (typefaceCache) {
            if (!typefaceCache.containsKey(assetPath)) {
                try {
                    Typeface t;
                    if (Build.VERSION.SDK_INT >= 26) {
                        Typeface.Builder builder = new Typeface.Builder(ApplicationLoader.applicationContext.getAssets(), assetPath);
                        if (assetPath.contains("rextrabold")) {
                            builder.setWeight(800);
                        }
                        if (assetPath.contains("medium") || assetPath.contains("rbold")) {
                            builder.setWeight(700);
                        }
                        if (assetPath.contains("italic")) {
                            builder.setItalic(true);
                        }
                        t = builder.build();
                    } else {
                        t = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), assetPath);
                    }
                    typefaceCache.put(assetPath, t);
                } catch (Exception e) {
                    if (BuildVars.LOGS_ENABLED) {
                        FileLog.e("Could not get typeface '" + assetPath + "' because " + e.getMessage());
                    }
                    return null;
                }
            }
            return typefaceCache.get(assetPath);
        }
    }
'''
          new = '''    public static Typeface getTypeface(String assetPath) {
        final String selectedFont = PersianFontManager.getSelectedFont();
        final String resolvedAssetPath = PersianFontManager.resolveAssetPath(assetPath);
        final String cacheKey = assetPath + "#" + selectedFont;
        synchronized (typefaceCache) {
            if (!typefaceCache.containsKey(cacheKey)) {
                try {
                    Typeface t;
                    if (Build.VERSION.SDK_INT >= 26) {
                        Typeface.Builder builder = new Typeface.Builder(ApplicationLoader.applicationContext.getAssets(), resolvedAssetPath);
                        if (assetPath.contains("rextrabold")) {
                            builder.setWeight(800);
                        }
                        if (assetPath.contains("medium") || assetPath.contains("rbold")) {
                            builder.setWeight(700);
                        }
                        if (assetPath.contains("italic")) {
                            builder.setItalic(true);
                        }
                        t = builder.build();
                    } else {
                        t = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), resolvedAssetPath);
                    }
                    typefaceCache.put(cacheKey, t);
                } catch (Exception e) {
                    if (!resolvedAssetPath.equals(assetPath)) {
                        try {
                            Typeface fallback = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), assetPath);
                            typefaceCache.put(cacheKey, fallback);
                            return fallback;
                        } catch (Exception ignored) {
                        }
                    }
                    if (BuildVars.LOGS_ENABLED) {
                        FileLog.e("Could not get typeface '" + resolvedAssetPath + "' because " + e.getMessage());
                    }
                    return null;
                }
            }
            return typefaceCache.get(cacheKey);
        }
    }

    public static void clearTypefaceCache() {
        synchronized (typefaceCache) {
            typefaceCache.clear();
            mediumTypeface = null;
        }
    }
'''
          if 'final String selectedFont = PersianFontManager.getSelectedFont();' not in text:
              if old not in text:
                  raise SystemExit('Expected AndroidUtilities.getTypeface block not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          manager = Path('TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java')
          mtext = manager.read_text(encoding='utf-8')
          old_set = '''        context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                .edit()
                .putString(PREF_KEY, fontId)
                .apply();
'''
          new_set = '''        context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                .edit()
                .putString(PREF_KEY, fontId)
                .apply();
        AndroidUtilities.clearTypefaceCache();
'''
          if 'AndroidUtilities.clearTypefaceCache();' not in mtext:
              if old_set not in mtext:
                  raise SystemExit('Expected PersianFontManager preference block not found')
              manager.write_text(mtext.replace(old_set, new_set, 1), encoding='utf-8')
          PY

          if ! git diff --quiet -- TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java
            git commit -m "Wire Persian font manager into typeface engine [skip ci]"
            git push origin HEAD:feature/persian-font-selector
          fi
      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nttld/setup-ndk@v1.4.2
        id: setup-ndk-r27c
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: nttld/setup-ndk@v1.4.2
        id: setup-ndk-r23c
        with:
          ndk-version: r23c
          link-to-sdk: true
      - name: Install NDK for the JNI build (ndkVersion).
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Prepare additional build number.
        env:
          ADDITIONAL_BUILD: ${{ secrets.ADDITIONAL_BUILD_NUMBER }}
        run: |
          result=$((ADDITIONAL_BUILD / 10000))
          echo "ADDITIONAL_BUILD_NUMBER = $result should be between 0 and 10!"
          echo "ADDITIONAL_BUILD_NUMBER=$result" >> $GITHUB_ENV
          echo "USER_REPO=$GITHUB_REPOSITORY" >> $GITHUB_ENV
          echo "CHECK_UPDATES=1" >> $GITHUB_ENV
      - name: Build.
        run: |
          ###
          vars=gradle.properties

          echo "DUMMY_CONST=0" >> $vars
          echo "org.gradle.workers.max=1" >> $vars
          echo "APP_ID=${{ secrets.APP_ID }}" >> $vars
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> $vars
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ALIAS_PASS }}" >> $vars
          echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS_NAME }}" >> $vars
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASS }}" >> $vars
          echo "RELEASE_KEYSTORE_FILE=$PWD/TMessagesProj/config/release.keystore" >> $vars
          echo "ADDITIONAL_BUILD_NUMBER=$ADDITIONAL_BUILD_NUMBER" >> $vars
          echo "USER_REPO=$USER_REPO" >> $vars
          echo "CHECK_UPDATES=1" >> $vars
          echo "USER_ID_OWNER=${{ secrets.USER_ID_OWNER }}" >> $vars
          echo "UPDATE_CHANNEL_USERNAME=${{ secrets.UPDATE_CHANNEL_USERNAME }}" >> $vars
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> $vars
          echo "LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}" >> $vars
          echo "NATIVE_DEPS_NDK_DIR=${{ steps.setup-ndk-r27c.outputs.ndk-path }}" >> $vars

          ###
          echo $ADDITIONAL_BUILD_NUMBER
          sudo apt update
          sudo apt -y install ninja-build meson unzip pip gperf
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          ./gradlew :TMessagesProj_App:assembleAfatRelease

          grep VERSION_NAME TMessagesProj/build/generated/source/buildConfig/release/org/telegram/messenger/BuildConfig.java | cut -d'"' -f 2 > ver.txt

          mkdir -p artifact
          mv TMessagesProj_App/build/outputs/apk/afat/release/app.apk app.apk
          cp app.apk "artifact/ForkClient $(cat ver.txt).apk"
          mkdir -p tag_asset
          cp app.apk "tag_asset/ForkClient_$(cat ver.txt).apk"

          if [[ "${{ contains(github.event.head_commit.message, '[Release]') }}" == "true" ]]; then
            set +x
            pip install requests tgcrypto-pyrofork Kurigram
            cp app.apk "ForkClient $(cat ver.txt).apk"
            echo "${{ secrets.BASE64_ZIP }}" | base64 --decode > output.zip
            unzip -j output.zip -d .
            ls
            python3 upload.py
            set -x
          else
            echo "Skipping channel upload (no [Release] marker in commit message)."
          fi
          ###

          echo "NEW_TAG_TEXT=$(cat ver.txt)" >> $GITHUB_ENV

          tempVer=$(cat ver.txt)
          tempVer=${tempVer::-2}
          echo "NEW_OFFICIAL_TAG_TEXT=$tempVer" >> $GITHUB_ENV
      - name: Attest build provenance
        if: ${{ contains(github.event.head_commit.message, '[Release]') }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifact/*.apk'

      - uses: actions/upload-artifact@master
        name: Upload artifact
        if: ${{ contains(github.event.head_commit.message, '[Release]') }}
        with:
          name: ForkClient
          path: artifact/

  release:
    name: Create Release.
    needs: linux
    if: ${{ contains(github.event.head_commit.message, '[Release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Download artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ForkClient
          path: asset
      - name: Get version info
        run: |
          find asset -name "*.apk" | head -1 | sed 's/.*ForkClient //;s/\.apk//' > version.txt
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV
          echo "OFFICIAL_VERSION=$(cat version.txt | sed 's/..$//')" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v0.1.15
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        with:
          draft: true
          files: asset/*
          tag_name: ${{ env.VERSION }}
          name: "ForkClient ${{ env.VERSION }}"
          body: "— Updated to ${{ env.OFFICIAL_VERSION }} build of the official Telegram."
