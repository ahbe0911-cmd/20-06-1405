name: Persian Font Engine Patch

on:
  push:
    branches:
      - feature/persian-font-selector
    paths:
      - '.github/workflows/persian-font-engine.yml'
      - 'TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persian-font-selector
          fetch-depth: 0

      - name: Patch AndroidUtilities font engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java')
          text = path.read_text(encoding='utf-8')

          old = '''    public static Typeface getTypeface(String assetPath) {
        synchronized (typefaceCache) {
            if (!typefaceCache.containsKey(assetPath)) {
                try {
                    Typeface t;
                    if (Build.VERSION.SDK_INT >= 26) {
                        Typeface.Builder builder = new Typeface.Builder(ApplicationLoader.applicationContext.getAssets(), assetPath);
                        if (assetPath.contains("rextrabold")) {
                            builder.setWeight(800);
                        }
                        if (assetPath.contains("medium") || assetPath.contains("rbold")) {
                            builder.setWeight(700);
                        }
                        if (assetPath.contains("italic")) {
                            builder.setItalic(true);
                        }
                        t = builder.build();
                    } else {
                        t = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), assetPath);
                    }
                    typefaceCache.put(assetPath, t);
                } catch (Exception e) {
                    if (BuildVars.LOGS_ENABLED) {
                        FileLog.e("Could not get typeface '" + assetPath + "' because " + e.getMessage());
                    }
                    return null;
                }
            }
            return typefaceCache.get(assetPath);
        }
    }
'''

          new = '''    public static Typeface getTypeface(String assetPath) {
        final String selectedFont = PersianFontManager.getSelectedFont();
        final String resolvedAssetPath = PersianFontManager.resolveAssetPath(assetPath);
        final String cacheKey = assetPath + "#" + selectedFont;
        synchronized (typefaceCache) {
            if (!typefaceCache.containsKey(cacheKey)) {
                try {
                    Typeface t;
                    if (Build.VERSION.SDK_INT >= 26) {
                        Typeface.Builder builder = new Typeface.Builder(ApplicationLoader.applicationContext.getAssets(), resolvedAssetPath);
                        if (assetPath.contains("rextrabold")) {
                            builder.setWeight(800);
                        }
                        if (assetPath.contains("medium") || assetPath.contains("rbold")) {
                            builder.setWeight(700);
                        }
                        if (assetPath.contains("italic")) {
                            builder.setItalic(true);
                        }
                        t = builder.build();
                    } else {
                        t = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), resolvedAssetPath);
                    }
                    typefaceCache.put(cacheKey, t);
                } catch (Exception e) {
                    if (!resolvedAssetPath.equals(assetPath)) {
                        try {
                            Typeface fallback = Typeface.createFromAsset(ApplicationLoader.applicationContext.getAssets(), assetPath);
                            typefaceCache.put(cacheKey, fallback);
                            return fallback;
                        } catch (Exception ignored) {
                        }
                    }
                    if (BuildVars.LOGS_ENABLED) {
                        FileLog.e("Could not get typeface '" + resolvedAssetPath + "' because " + e.getMessage());
                    }
                    return null;
                }
            }
            return typefaceCache.get(cacheKey);
        }
    }

    public static void clearTypefaceCache() {
        synchronized (typefaceCache) {
            typefaceCache.clear();
            mediumTypeface = null;
        }
    }
'''

          if 'final String selectedFont = PersianFontManager.getSelectedFont();' in text:
              print('AndroidUtilities already patched')
          elif old not in text:
              raise SystemExit('Expected getTypeface block not found; refusing unsafe patch')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('AndroidUtilities patched')

          manager = Path('TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java')
          mtext = manager.read_text(encoding='utf-8')
          old_set = '''        context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                .edit()
                .putString(PREF_KEY, fontId)
                .apply();
'''
          new_set = '''        context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                .edit()
                .putString(PREF_KEY, fontId)
                .apply();
        AndroidUtilities.clearTypefaceCache();
'''
          if 'AndroidUtilities.clearTypefaceCache();' not in mtext:
              if old_set not in mtext:
                  raise SystemExit('Expected PersianFontManager preference block not found')
              manager.write_text(mtext.replace(old_set, new_set, 1), encoding='utf-8')
              print('PersianFontManager cache reset wired')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java TMessagesProj/src/main/java/org/telegram/messenger/PersianFontManager.java
          git commit -m "Wire Persian font manager into typeface engine [skip ci]"
          git push origin HEAD:feature/persian-font-selector
